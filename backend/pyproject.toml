[project]
name = "leadintel"
version = "0.2.0"
description = "Local business acquisition & website-opportunity intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "httpcore>=1.0.7",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "paramiko>=3.5",
  "pyarrow>=18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-timeout>=2.3"]

[project.scripts]
leadintel = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: performs real network requests (opt-in with LEADINTEL_LIVE_TESTS=1)"]
timeout = 120
