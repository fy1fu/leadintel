# Source reliability defaults (0..1) per field group. Used in field confidence; documented, not hidden.
version: 1
sources:
  overture:
    name: "Overture Maps Places"
    licence: "CDLA-Permissive-2.0 / Apache-2.0 / CC0 (per record)"
    attribution: "© Overture Maps Foundation and contributors"
    reliability: {name: 0.8, category: 0.6, location: 0.8, phone: 0.6, website: 0.5, social: 0.5, email: 0.4, operating_status: 0.6}
  sunbiz:
    name: "Florida Division of Corporations (Sunbiz) bulk data"
    licence: "Public record (Florida)"
    attribution: "Florida Department of State, Division of Corporations"
    reliability: {name: 0.95, filing: 0.95, status: 0.9, address: 0.7}
  census_geocoder:
    name: "US Census Geocoder"
    licence: "Public domain (US Government)"
    attribution: "U.S. Census Bureau"
    reliability: {location: 0.8}
  dbpr:
    name: "Florida DBPR licensee extracts"
    licence: "Public record (Florida, ch. 119 F.S.)"
    attribution: "Florida Department of Business and Professional Regulation"
    reliability: {licence: 0.9, name: 0.8, address: 0.5}
    # Licensee files used as evidence (column meanings inferred - verification item V13)
    files:
      - {url: "https://www2.myfloridalicense.com/sto/file_download/extracts/CONSTRUCTIONLICENSE_1.csv", serves: [home_trades, pressure_washing]}
      - {url: "https://www2.myfloridalicense.com/sto/file_download/extracts/COSMETOLOGYLICENSE_1.csv", serves: [general]}  # salons etc.; evidence only
